# conversation-handoff storage
#
# type:
#   sqlite    local embedded database (default)
#   postgres  PostgreSQL
#   file      accepted for older configs; mapped to sqlite. JSON files
#             in the data dir are imported once.
#
# url:
#   sqlite    path to the .db file (empty = platform data dir / handoff.db)
#   postgres  host:port/database  or  postgres://user:pass@host:port/database
#
# user / password: postgres. password may also come from
# CONVERSATION_HANDOFF_DB_PASSWORD.
#
# ssl: postgres only. omit to try TLS then plain. set false for no TLS.
#
# encryption_key: encrypt title / latest_message / brief / chunks / summary
# and image bytes at rest. Also CONVERSATION_HANDOFF_ENCRYPTION_KEY.
# Changing the key makes old data unreadable.
#
# max_image_bytes: reject attached images larger than this (default 10 MB).

store:
  type: sqlite
  url: ""
  user: ""
  password: ""
  encryption_key: ""
  max_image_bytes: 10485760
