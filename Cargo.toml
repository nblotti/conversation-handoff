[package]
name = "conversation-handoff"
version = "0.5.2"
edition = "2021"
rust-version = "1.85"
description = "Hand off a full Claude or Codex conversation to a new chat, and recall only the parts that still matter."
license = "MIT"
readme = "README.md"
repository = "https://github.com/nblotti/conversation-handoff"
keywords = ["mcp", "claude", "codex", "conversation", "handoff"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
postgres = "0.19"
rmcp = { version = "3.1", features = ["server", "transport-io", "macros", "schemars"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "native-certs", "webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
toml_edit = "0.22"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
