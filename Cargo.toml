[package]
name = "conversation-handoff"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Hand off a full Claude or Codex conversation to a new chat, and recall only the parts that still matter."
license = "MIT"
readme = "README.md"
repository = "https://github.com/nblotti/conversation-handoff"
keywords = ["mcp", "claude", "codex", "conversation", "handoff"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rmcp = { version = "3.1", features = ["server", "transport-io", "macros", "schemars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"
